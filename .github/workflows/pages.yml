name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_tmdb:
        description: Refresh all referenced TMDB metadata and posters
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .cache/tmdb
          key: tmdb-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tmdb-v1-
      - name: Import TMDB links
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          REFRESH_TMDB: ${{ inputs.refresh_tmdb }}
        run: |
          if [ "$REFRESH_TMDB" = "true" ]; then
            python3 scripts/import_tmdb.py --refresh
          else
            python3 scripts/import_tmdb.py
          fi
      - name: Validate diary tables and run tests
        run: |
          python3 scripts/check.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check rendering and filter logic
        run: node scripts/test_app.mjs
      - name: Build static site
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
