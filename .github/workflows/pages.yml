name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resolve_catalogue:
        description: Resolve catalogue titles to TMDB and export metadata
        type: boolean
        default: false
      verify_tmdb_url:
        description: Optional TMDB URL to test without adding a viewing
        type: string
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: .cache/tmdb
          key: tmdb-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tmdb-v1-
      - name: Resolve catalogue to TMDB
        if: ${{ inputs.resolve_catalogue == true }}
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: python3 scripts/resolve_titles.py
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.resolve_catalogue == true }}
        with:
          name: tmdb-catalogue
          path: .cache/tmdb
          include-hidden-files: true
      - name: Verify requested TMDB link
        if: ${{ inputs.verify_tmdb_url != '' }}
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_TEST_URL: ${{ inputs.verify_tmdb_url }}
        run: python3 scripts/import_tmdb.py --check-url "$TMDB_TEST_URL"
      - name: Import TMDB links
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          python3 scripts/import_tmdb.py --refresh --write-names
      - name: Sort, format, and lint YAML
        run: |
          python3 scripts/format_diary.py
          python3 -m yamllint --strict -c .yamllint.yaml diary data/season-continuations.yaml .github/workflows/pages.yml .yamllint.yaml
          python3 scripts/format_diary.py --check
      - name: Validate diary records and run tests
        run: |
          python3 scripts/check.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check rendering and filter logic
        run: node scripts/test_app.mjs
      - name: Build static site
        run: python3 scripts/build.py
      - name: Save names and formatted YAML
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if git diff --quiet -- diary; then
            exit 0
          fi
          git add -- diary/*.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update diary names and formatting [skip ci]" -m "Co-authored-by: Codex <noreply@openai.com>"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
